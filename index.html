<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f0f4ff">
<title>SDVX 18対策</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root {
    --bg: #f0f4ff;
    --bg2: #ffffff;
    --bg3: #f5f7ff;
    --bg4: #e8ecfa;
    --border: rgba(100,110,200,0.15);
    --text: #1a1a2e;
    --text2: #5a5a7a;
    --text3: #9a9ab0;
    --accent: #5b4fe8;
    --accent2: #7c6af7;
    --accent-bg: rgba(91,79,232,0.08);
    --blue: #2563eb;
    --blue-bg: rgba(37,99,235,0.1);
    --yellow: #d97706;
    --yellow-bg: rgba(217,119,6,0.1);
    --red: #dc2626;
    --red-bg: rgba(220,38,38,0.1);
    --green: #059669;
    --green-bg: rgba(5,150,105,0.1);
    --radius: 14px;
    --radius-sm: 9px;
    --shadow: 0 2px 12px rgba(91,79,232,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
  }

  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(240,244,255,0.96);
    backdrop-filter: blur(16px);
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 8px rgba(91,79,232,0.06);
  }

  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }

  .header-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 19px; font-weight: 700; letter-spacing: 1.5px;
    color: var(--accent);
  }

  .header-count { font-size: 11px; color: var(--text3); }

  .search-row { display: flex; gap: 8px; align-items: center; }
  .search-wrap { flex: 1; position: relative; }

  .search-icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text3); font-size: 14px; pointer-events: none;
  }

  .search-input {
    width: 100%; background: var(--bg2);
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    padding: 8px 10px 8px 32px; color: var(--text); font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif; outline: none;
    box-shadow: var(--shadow); transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent2); }
  .search-input::placeholder { color: var(--text3); }

  .filter-btn {
    background: var(--bg2); border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 12px;
    color: var(--text2); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 5px; white-space: nowrap;
    box-shadow: var(--shadow); transition: all 0.2s;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .filter-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

  .filter-indicator { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: none; }
  .filter-indicator.show { display: block; }

  .active-filters { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 14px 0; }

  .filter-pill {
    background: var(--accent-bg); border: 1px solid rgba(91,79,232,0.2);
    border-radius: 20px; padding: 3px 10px; font-size: 11px; color: var(--accent);
    display: flex; align-items: center; gap: 5px; cursor: pointer;
  }

  .list { padding: 8px 12px 100px; }
  .result-info { font-size: 11px; color: var(--text3); padding: 8px 2px 6px; }

  .song-card {
    background: var(--bg2); border: 1.5px solid var(--border);
    border-radius: var(--radius); margin-bottom: 8px; overflow: hidden;
    cursor: pointer; transition: transform 0.12s, box-shadow 0.12s;
    position: relative; box-shadow: var(--shadow);
  }
  .song-card:active { transform: scale(0.98); box-shadow: none; }

  .card-danger-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 14px 0 0 14px; }

  .card-inner { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; }

  .jacket { width: 52px; height: 52px; border-radius: 8px; background: var(--bg4); flex-shrink: 0; overflow: hidden; }
  .jacket img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }

  .card-body { flex: 1; min-width: 0; }

  .card-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; color: var(--text); }

  .card-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }

  .badge { font-family: 'Rajdhani', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; padding: 2px 7px; border-radius: 5px; background: var(--bg4); color: var(--text2); }
  .badge-type { color: var(--accent); background: var(--accent-bg); }
  .badge-bpm { color: var(--text3); background: var(--bg3); }
  .card-danger-badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; }

  .card-right { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; }

  .check-circle {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; pointer-events: none;
  }
  .check-circle.done { background: var(--green); border-color: var(--green); color: white; }

  .danger-none .card-danger-bar { background: var(--blue); }
  .danger-caution .card-danger-bar { background: var(--yellow); }
  .danger-danger .card-danger-bar { background: var(--red); }
  .danger-unset .card-danger-bar { background: var(--bg4); }

  .dbadge-none { background: var(--blue-bg); color: var(--blue); }
  .dbadge-caution { background: var(--yellow-bg); color: var(--yellow); }
  .dbadge-danger { background: var(--red-bg); color: var(--red); }

  .overlay {
    position: fixed; inset: 0; background: rgba(30,30,60,0.4); z-index: 200;
    display: flex; flex-direction: column; justify-content: flex-end;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .overlay.open { opacity: 1; pointer-events: all; }

  .detail-modal {
    background: var(--bg2); border-radius: 20px 20px 0 0;
    padding: 0 0 40px; max-height: 92vh; overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
    box-shadow: 0 -4px 30px rgba(91,79,232,0.15);
  }
  .overlay.open .detail-modal { transform: translateY(0); }

  .modal-handle { width: 36px; height: 4px; background: var(--bg4); border-radius: 2px; margin: 12px auto 0; }

  .modal-header-section {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 14px 16px 12px; border-bottom: 1px solid var(--border);
  }

  .modal-jacket { width: 64px; height: 64px; border-radius: 10px; background: var(--bg4); flex-shrink: 0; overflow: hidden; }
  .modal-jacket img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }

  .modal-header-right { flex: 1; min-width: 0; }

  .modal-song-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; color: var(--text); line-height: 1.3; }

  .modal-song-meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }

  .done-inline-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--bg3); border: 1.5px solid var(--border);
    border-radius: 20px; padding: 4px 12px; font-size: 11px; color: var(--text2);
    cursor: pointer; transition: all 0.15s;
    font-family: 'Noto Sans JP', sans-serif; margin-top: 7px;
  }
  .done-inline-btn.done { background: var(--green-bg); border-color: var(--green); color: var(--green); font-weight: 700; }

  .modal-body { padding: 14px 16px; }
  .field-block { margin-bottom: 16px; }

  .field-label {
    font-size: 11px; color: var(--text3); letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 7px;
    font-family: 'Rajdhani', sans-serif; font-weight: 600;
  }

  .toggle-row { display: flex; gap: 6px; }

  .toggle-btn {
    flex: 1; background: var(--bg3); border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 4px; text-align: center;
    font-size: 12px; color: var(--text2); cursor: pointer; transition: all 0.15s;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .toggle-btn:active { transform: scale(0.97); }
  .toggle-btn.sel-blue { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); font-weight: 700; }
  .toggle-btn.sel-yellow { background: var(--yellow-bg); border-color: var(--yellow); color: var(--yellow); font-weight: 700; }
  .toggle-btn.sel-red { background: var(--red-bg); border-color: var(--red); color: var(--red); font-weight: 700; }
  .toggle-btn.sel-accent { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 700; }

  .memo-area {
    width: 100%; background: var(--bg3); border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px; color: var(--text);
    font-size: 13px; font-family: 'Noto Sans JP', sans-serif;
    resize: none; outline: none; min-height: 80px; transition: border-color 0.2s;
  }
  .memo-area:focus { border-color: var(--accent2); }

  .chart-btn {
    width: 100%; background: var(--accent); border: none;
    border-radius: var(--radius-sm); padding: 12px; color: white;
    font-size: 13px; font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    gap: 8px; transition: all 0.15s; font-weight: 700; letter-spacing: 0.5px;
  }
  .chart-btn:active { transform: scale(0.98); opacity: 0.9; }

  /* 譜面モーダル */
  .chart-overlay {
    position: fixed; inset: 0; background: rgba(10,10,30,0.9); z-index: 300;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .chart-overlay.open { opacity: 1; pointer-events: all; }

  .chart-modal-header {
    background: var(--bg2); padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }

  .chart-modal-title {
    font-size: 13px; font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1; margin-right: 10px;
  }

  .chart-close-btn {
    background: var(--bg4); border: none; border-radius: 8px;
    padding: 6px 12px; font-size: 12px; color: var(--text2);
    cursor: pointer; font-family: 'Noto Sans JP', sans-serif; flex-shrink: 0;
  }

  .chart-iframe-wrap { flex: 1; overflow: hidden; position: relative; }

  .chart-iframe { width: 100%; height: 100%; border: none; background: #fff; }

  /* FILTER MODAL */
  .filter-modal {
    background: var(--bg2); border-radius: 20px 20px 0 0;
    padding: 0 0 40px; max-height: 85vh; overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
    box-shadow: 0 -4px 30px rgba(91,79,232,0.15);
  }
  .overlay.open .filter-modal { transform: translateY(0); }

  .filter-modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 12px; border-bottom: 1px solid var(--border);
  }

  .filter-modal-title { font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 1px; color: var(--text); }

  .reset-btn {
    background: none; border: 1.5px solid var(--border); border-radius: 6px;
    padding: 5px 12px; color: var(--text3); font-size: 12px;
    font-family: 'Noto Sans JP', sans-serif; cursor: pointer; transition: all 0.15s;
  }
  .reset-btn:active { color: var(--red); border-color: var(--red); }

  .filter-modal-body { padding: 14px 16px; }

  .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }

  .level-chip {
    background: var(--bg3); border: 1.5px solid var(--border); border-radius: 7px;
    padding: 7px 4px; text-align: center;
    font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 600;
    color: var(--text2); cursor: pointer; transition: all 0.15s;
  }
  .level-chip.sel { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 700; }

  .danger-grid { display: flex; gap: 6px; }

  .danger-chip {
    flex: 1; background: var(--bg3); border: 1.5px solid var(--border);
    border-radius: 7px; padding: 8px 4px; text-align: center;
    font-size: 12px; color: var(--text2); cursor: pointer; transition: all 0.15s;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .danger-chip.sel-blue { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); font-weight: 700; }
  .danger-chip.sel-yellow { background: var(--yellow-bg); border-color: var(--yellow); color: var(--yellow); font-weight: 700; }
  .danger-chip.sel-red { background: var(--red-bg); border-color: var(--red); color: var(--red); font-weight: 700; }

  .status-toggle {
    display: flex; background: var(--bg3); border-radius: var(--radius-sm);
    padding: 3px; gap: 3px; border: 1.5px solid var(--border);
  }

  .status-opt {
    flex: 1; text-align: center; padding: 7px 4px; border-radius: 6px;
    font-size: 12px; color: var(--text2); cursor: pointer; transition: all 0.15s;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .status-opt.sel { background: var(--bg2); color: var(--text); font-weight: 700; box-shadow: 0 1px 4px rgba(91,79,232,0.1); }

  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 16px; color: var(--text3); }
  .loading-spinner { width: 36px; height: 36px; border: 2px solid var(--bg4); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; }
  .empty { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 13px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-title">SDVX 18対策</div>
    <div class="header-count" id="headerCount">読み込み中...</div>
  </div>
  <div class="search-row">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text" placeholder="曲名を検索..." oninput="applyFilters()">
    </div>
    <button class="filter-btn" id="filterBtn" onclick="openFilterModal()">
      <span>絞込</span>
      <div class="filter-indicator" id="filterIndicator"></div>
    </button>
  </div>
</div>

<div class="active-filters" id="activePills"></div>
<div class="list" id="listContainer">
  <div class="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">楽曲データを読み込み中...</div>
  </div>
</div>

<!-- DETAIL OVERLAY -->
<div class="overlay" id="detailOverlay" onclick="handleOverlayClick(event,'detail')">
  <div class="detail-modal" id="detailModal">
    <div class="modal-handle"></div>
    <div class="modal-header-section">
      <div class="modal-jacket" id="modalJacket"></div>
      <div class="modal-header-right">
        <div class="modal-song-title" id="modalTitle"></div>
        <div class="modal-song-meta" id="modalMeta"></div>
        <button class="done-inline-btn" id="doneInlineBtn" onclick="toggleDone()">対策済みにする</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="field-block">
        <div class="field-label">危険度</div>
        <div class="toggle-row">
          <div class="toggle-btn" id="d-none" onclick="setDanger('none')">問題なし</div>
          <div class="toggle-btn" id="d-caution" onclick="setDanger('caution')">要注意</div>
          <div class="toggle-btn" id="d-danger" onclick="setDanger('danger')">危険</div>
        </div>
      </div>
      <div class="field-block">
        <div class="field-label">ミラー</div>
        <div class="toggle-row">
          <div class="toggle-btn" id="m-no" onclick="setMirror('no')">なし</div>
          <div class="toggle-btn" id="m-yes" onclick="setMirror('yes')">あり</div>
        </div>
      </div>
      <div class="field-block">
        <div class="field-label">判定</div>
        <div class="toggle-row">
          <div class="toggle-btn" id="j-early" onclick="setJudge('early')">早め</div>
          <div class="toggle-btn" id="j-normal" onclick="setJudge('normal')">普通</div>
          <div class="toggle-btn" id="j-late" onclick="setJudge('late')">遅め</div>
        </div>
      </div>
      <div class="field-block">
        <div class="field-label">メモ</div>
        <textarea class="memo-area" id="memoArea" oninput="onMemoInput()"></textarea>
      </div>
      <button class="chart-btn" onclick="openChartModal()">譜面を確認</button>
    </div>
  </div>
</div>

<!-- FILTER OVERLAY -->
<div class="overlay" id="filterOverlay" onclick="handleOverlayClick(event,'filter')">
  <div class="filter-modal" id="filterModal">
    <div class="modal-handle"></div>
    <div class="filter-modal-header">
      <div class="filter-modal-title">絞り込み</div>
      <button class="reset-btn" onclick="resetFilters()">リセット</button>
    </div>
    <div class="filter-modal-body">
      <div class="field-block">
        <div class="field-label">難易度（選択なし＝全て）</div>
        <div class="level-grid" id="levelGrid"></div>
      </div>
      <div class="field-block">
        <div class="field-label">危険度（選択なし＝全て）</div>
        <div class="danger-grid">
          <div class="danger-chip" id="fc-none" onclick="toggleDangerFilter('none')">🔵 問題なし</div>
          <div class="danger-chip" id="fc-caution" onclick="toggleDangerFilter('caution')">🟡 要注意</div>
          <div class="danger-chip" id="fc-danger" onclick="toggleDangerFilter('danger')">🔴 危険</div>
        </div>
      </div>
      <div class="field-block">
        <div class="field-label">対策状況</div>
        <div class="status-toggle">
          <div class="status-opt sel" id="fs-all" onclick="setStatusFilter('all')">全て</div>
          <div class="status-opt" id="fs-undone" onclick="setStatusFilter('undone')">未対策</div>
          <div class="status-opt" id="fs-done" onclick="setStatusFilter('done')">対策済み</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 譜面モーダル -->
<div class="chart-overlay" id="chartOverlay">
  <div class="chart-modal-header">
    <div class="chart-modal-title" id="chartModalTitle"></div>
    <button class="chart-close-btn" onclick="closeChartModal()">✕ 閉じる</button>
  </div>
  <div class="chart-iframe-wrap">
    <iframe class="chart-iframe" id="chartIframe" src=""></iframe>
  </div>
</div>

<script>
const TYPE_LABEL = {
  novice:'NOV', advanced:'ADV', exhaust:'EXH',
  maximum:'MXM', heavenly:'HVN', gravity:'GRV',
  infinite:'INF', vivid:'VVD', exceed:'XCD', nabla:'NBL'
};

const MEMO_KEY = 'sdvx18_memo_v1';
let songs = [], memoData = {}, currentKey = null, memoTimer = null, currentChartUrl = '';
let fLevels = new Set(), fDanger = new Set(), fStatus = 'all';

function getMemo(key) {
  return memoData[key] || { danger:'', mirror:'no', judge:'normal', memo:'', done:false };
}
function saveMemo(key, data) {
  memoData[key] = data;
  localStorage.setItem(MEMO_KEY, JSON.stringify(memoData));
}

async function loadSongs() {
  try {
    const res = await fetch('./songs.json');
    const data = await res.json();
    data.forEach(s => { s.typeLabel = TYPE_LABEL[s.type] || s.type.toUpperCase(); });
    songs = data;
    render();
  } catch(e) {
    document.getElementById('listContainer').innerHTML = '<div class="empty">データの読み込みに失敗しました。<br>ページを再読み込みしてください。</div>';
  }
}

function buildLevelGrid() {
  const actualLevels = [...new Set(songs.map(s => s.level))].sort((a,b)=>a-b);
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  actualLevels.forEach(lv => {
    const chip = document.createElement('div');
    chip.className = 'level-chip' + (fLevels.has(lv) ? ' sel' : '');
    chip.textContent = lv.toFixed(1);
    chip.onclick = () => toggleLevelFilter(lv);
    chip.id = `lv-${lv.toFixed(1).replace('.','_')}`;
    grid.appendChild(chip);
  });
}

function render() {
  memoData = JSON.parse(localStorage.getItem(MEMO_KEY) || '{}');
  buildLevelGrid();
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = songs.filter(s => {
    if (q && !s.title.toLowerCase().includes(q)) return false;
    if (fLevels.size > 0 && !fLevels.has(s.level)) return false;
    const m = getMemo(s.key);
    if (fDanger.size > 0 && !fDanger.has(m.danger || 'none')) return false;
    if (fStatus === 'done' && !m.done) return false;
    if (fStatus === 'undone' && m.done) return false;
    return true;
  });

  document.getElementById('headerCount').textContent = `${filtered.length} / ${songs.length}曲`;
  updatePills();
  updateFilterIndicator();

  const container = document.getElementById('listContainer');
  if (filtered.length === 0) { container.innerHTML = '<div class="empty">該当する曲がありません</div>'; return; }

  container.innerHTML = `<div class="result-info">${filtered.length}曲表示中</div>`;
  filtered.forEach(s => {
    const m = getMemo(s.key);
    const dangerClass = m.danger ? `danger-${m.danger}` : 'danger-unset';
    const badgeClass = m.danger ? `dbadge-${m.danger}` : '';
    const dangerLabel = { none:'問題なし', caution:'要注意', danger:'危険' }[m.danger] || '';
    const card = document.createElement('div');
    card.className = `song-card ${dangerClass}`;
    card.innerHTML = `
      <div class="card-danger-bar"></div>
      <div class="card-inner">
        <div class="jacket">${s.jacket ? `<img src="${s.jacket}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}</div>
        <div class="card-body">
          <div class="card-title">${escHtml(s.title)}</div>
          <div class="card-meta">
            <span class="badge badge-type">${s.typeLabel}</span>
            <span class="badge">${s.level.toFixed(1)}</span>
            <span class="badge badge-bpm">BPM ${s.bpm}</span>
            ${m.danger ? `<span class="badge card-danger-badge ${badgeClass}">${dangerLabel}</span>` : ''}
          </div>
        </div>
        <div class="card-right">
          <div class="check-circle ${m.done ? 'done' : ''}">${m.done ? '✓' : ''}</div>
        </div>
      </div>`;
    card.onclick = () => openDetail(s.key);
    container.appendChild(card);
  });
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function openDetail(key) {
  currentKey = key;
  const s = songs.find(x => x.key === key);
  const m = getMemo(key);
  document.getElementById('modalTitle').textContent = s.title;
  document.getElementById('modalJacket').innerHTML = s.jacket ? `<img src="${s.jacket}" alt="" onerror="this.style.display='none'">` : '';
  document.getElementById('modalMeta').innerHTML = `
    <span class="badge badge-type">${s.typeLabel}</span>
    <span class="badge">${s.level.toFixed(1)}</span>
    <span class="badge badge-bpm">BPM ${s.bpm}</span>`;
  currentChartUrl = s.chartUrl;
  document.getElementById('chartModalTitle').textContent = s.title;
  updateDoneInlineBtn(m.done);
  updateDangerBtns(m.danger || '');
  updateMirrorBtns(m.mirror || 'no');
  updateJudgeBtns(m.judge || 'normal');
  document.getElementById('memoArea').value = m.memo || '';
  document.getElementById('detailOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  autoSave();
  document.getElementById('detailOverlay').classList.remove('open');
  document.body.style.overflow = '';
  currentKey = null;
  applyFilters();
}

function autoSave() {
  if (!currentKey) return;
  const m = getMemo(currentKey);
  m.memo = document.getElementById('memoArea').value;
  saveMemo(currentKey, m);
}

function onMemoInput() { clearTimeout(memoTimer); memoTimer = setTimeout(autoSave, 800); }

function setDanger(val) {
  if (!currentKey) return;
  const m = getMemo(currentKey);
  m.danger = m.danger === val ? '' : val;
  saveMemo(currentKey, m);
  updateDangerBtns(m.danger);
}

function updateDangerBtns(val) {
  ['none','caution','danger'].forEach(v => {
    document.getElementById(`d-${v}`).className = 'toggle-btn' + (val === v ? ` sel-${v === 'none' ? 'blue' : v === 'caution' ? 'yellow' : 'red'}` : '');
  });
}

function setMirror(val) {
  if (!currentKey) return;
  const m = getMemo(currentKey);
  m.mirror = val; saveMemo(currentKey, m); updateMirrorBtns(val);
}

function updateMirrorBtns(val) {
  document.getElementById('m-no').className = 'toggle-btn' + (val === 'no' ? ' sel-accent' : '');
  document.getElementById('m-yes').className = 'toggle-btn' + (val === 'yes' ? ' sel-accent' : '');
}

function setJudge(val) {
  if (!currentKey) return;
  const m = getMemo(currentKey);
  m.judge = val; saveMemo(currentKey, m); updateJudgeBtns(val);
}

function updateJudgeBtns(val) {
  ['early','normal','late'].forEach(v => {
    document.getElementById(`j-${v}`).className = 'toggle-btn' + (val === v ? ' sel-accent' : '');
  });
}

function toggleDone() {
  if (!currentKey) return;
  const m = getMemo(currentKey);
  m.done = !m.done; saveMemo(currentKey, m); updateDoneInlineBtn(m.done);
}

function updateDoneInlineBtn(done) {
  const btn = document.getElementById('doneInlineBtn');
  btn.className = `done-inline-btn${done ? ' done' : ''}`;
  btn.textContent = done ? '✓ 対策済み' : '対策済みにする';
}

function openChartModal() {
  const iframe = document.getElementById('chartIframe');
  iframe.src = currentChartUrl;
  document.getElementById('chartOverlay').classList.add('open');
}

function closeChartModal() {
  document.getElementById('chartOverlay').classList.remove('open');
  document.getElementById('chartIframe').src='';
}

function openFilterModal() {
  buildLevelGrid(); updateDangerFilterBtns(); updateStatusFilterBtns();
  document.getElementById('filterOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeFilterModal() {
  document.getElementById('filterOverlay').classList.remove('open');
  document.body.style.overflow = '';
  applyFilters();
}

function toggleLevelFilter(lv) {
  if (fLevels.has(lv)) fLevels.delete(lv); else fLevels.add(lv);
  const el = document.getElementById(`lv-${lv.toFixed(1).replace('.','_')}`);
  if (el) el.className = 'level-chip' + (fLevels.has(lv) ? ' sel' : '');
  applyFilters();
}

function toggleDangerFilter(val) {
  if (fDanger.has(val)) fDanger.delete(val); else fDanger.add(val);
  updateDangerFilterBtns(); applyFilters();
}

function updateDangerFilterBtns() {
  document.getElementById('fc-none').className = 'danger-chip' + (fDanger.has('none') ? ' sel-blue' : '');
  document.getElementById('fc-caution').className = 'danger-chip' + (fDanger.has('caution') ? ' sel-yellow' : '');
  document.getElementById('fc-danger').className = 'danger-chip' + (fDanger.has('danger') ? ' sel-red' : '');
}

function setStatusFilter(val) { fStatus = val; updateStatusFilterBtns(); applyFilters(); }

function updateStatusFilterBtns() {
  ['all','undone','done'].forEach(v => {
    document.getElementById(`fs-${v}`).className = 'status-opt' + (fStatus === v ? ' sel' : '');
  });
}

function resetFilters() {
  fLevels.clear(); fDanger.clear(); fStatus = 'all';
  buildLevelGrid(); updateDangerFilterBtns(); updateStatusFilterBtns(); applyFilters();
}

function updateFilterIndicator() {
  const active = fLevels.size > 0 || fDanger.size > 0 || fStatus !== 'all';
  document.getElementById('filterIndicator').className = 'filter-indicator' + (active ? ' show' : '');
  document.getElementById('filterBtn').className = 'filter-btn' + (active ? ' active' : '');
}

function updatePills() {
  const container = document.getElementById('activePills');
  container.innerHTML = '';
  fLevels.forEach(lv => {
    const pill = document.createElement('div');
    pill.className = 'filter-pill';
    pill.innerHTML = `${lv.toFixed(1)} <span onclick="toggleLevelFilter(${lv})">✕</span>`;
    container.appendChild(pill);
  });
  const dangerNames = { none:'問題なし', caution:'要注意', danger:'危険' };
  fDanger.forEach(d => {
    const pill = document.createElement('div');
    pill.className = 'filter-pill';
    pill.innerHTML = `${dangerNames[d]} <span onclick="toggleDangerFilter('${d}')">✕</span>`;
    container.appendChild(pill);
  });
  if (fStatus !== 'all') {
    const pill = document.createElement('div');
    pill.className = 'filter-pill';
    pill.innerHTML = `${fStatus === 'done' ? '対策済み' : '未対策'} <span onclick="setStatusFilter('all')">✕</span>`;
    container.appendChild(pill);
  }
}

function handleOverlayClick(e, type) {
  const modal = document.getElementById(type === 'detail' ? 'detailModal' : 'filterModal');
  if (!modal.contains(e.target)) { type === 'detail' ? closeDetail() : closeFilterModal(); }
}

loadSongs();
</script>
</body>
</html>
